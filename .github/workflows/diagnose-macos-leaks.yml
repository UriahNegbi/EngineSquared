name: Diagnose macOS leaks

on:
  push:
    branches:
      - ci/diagnose-macos-leaks

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: xmake-io/github-action-setup-xmake@fadadea1162ec75ce1541d5bb68226fb147c221e
        with:
          xmake-version: latest
      - name: Build affected tests
        run: |
          xmake f -y -m debug
          xmake build -y EventHandlerTest LoadFont LoadDocumentTest
      - name: Print leak reports
        run: |
          xmake check_leaks -v --targets EventHandlerTest LoadFont LoadDocumentTest
