name: Validate xmake plugin distribution

on:
  push:
    branches:
      - validation/xmake-plugin-618

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.1.1
      - name: Record version
        run: xmake --version
      - name: Validate local install and payload
        shell: bash
        run: |
          xmake plugin --install .
          xmake hello | tee local-output.txt
          grep -q "hello-ok payload-ok" local-output.txt
          xmake plugin --list | tee list-output.txt
          grep -q "EngineSquared" list-output.txt
          xmake plugin --remove EngineSquared
      - name: Validate GitHub branch install and reinstall behavior
        shell: bash
        run: |
          xmake plugin --install github:UriahNegbi/EngineSquared#validation/xmake-plugin-618
          xmake hello | tee git-output.txt
          grep -q "hello-ok payload-ok" git-output.txt
          if xmake plugin --install github:UriahNegbi/EngineSquared#validation/xmake-plugin-618; then
            echo "reinstall-result=success" | tee reinstall-output.txt
          else
            echo "reinstall-result=failed" | tee reinstall-output.txt
          fi
          xmake plugin --remove EngineSquared
          xmake plugin --install github:UriahNegbi/EngineSquared#validation/xmake-plugin-618
          xmake hello | tee reinstall-after-remove-output.txt
          grep -q "hello-ok payload-ok" reinstall-after-remove-output.txt
